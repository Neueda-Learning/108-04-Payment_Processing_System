# nginx routes all requests on port 80:
#   /  → React SPA
#   /accounts /payments /stats → Spring Boot :8080
#   /ws       → Spring Boot WebSocket :8080
#   /chat     → Python chatbot :8000

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React SPA – send unknown paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Spring Boot REST API
    location ~ ^/(accounts|payments|stats)(/.*)?$ {
        proxy_pass         http://spring-app:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Spring Boot WebSocket (SockJS / STOMP)
    location /ws/ {
        proxy_pass         http://spring-app:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400;
    }

    # Python chatbot
    location /chat {
        proxy_pass       http://chatbot:8000;
        proxy_set_header Host $host;
    }
}
