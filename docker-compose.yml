version: "3.9"

services:

  # ── MySQL database ─────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: flashpay-mysql
    restart: always
    environment:
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uapp_user", "-papp_password"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not exposed externally – only reachable inside the Docker network

  # ── Spring Boot backend ────────────────────────────────────────────────────
  spring-app:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: flashpay-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/app_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: app_user
      SPRING_DATASOURCE_PASSWORD: app_password
    ports:
      - "8090:8080"    # 8080 may be taken by Jenkins; nginx proxies internally on :8080

  # ── Python chatbot ─────────────────────────────────────────────────────────
  chatbot:
    build:
      context: ./chatbot
      dockerfile: Dockerfile
    container_name: flashpay-chatbot
    restart: always
    ports:
      - "8000:8000"

  # ── React frontend (nginx) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flashpay-frontend
    restart: always
    depends_on:
      - spring-app
      - chatbot
    ports:
      - "5173:3000"        # Access the app at http://<vm-ip>:5173/

volumes:
  mysql-data:
